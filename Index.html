<script>
// Tarot: en|pt|símbolo|elemento|astro|resposta|significado|simbolismo|dinheiro|amor|escolhas|místico|invertida
const T=`The Fool|O Louco|🃏|Ar|Urano|S|Novos começos, espontaneidade, fé no desconhecido.|Jovem à beira do penhasco com cão e rosa branca: inocência e salto de fé.|Oportunidade arriscada; invista com leveza, mas sem imprudência.|Paixão nova, abertura, leveza; evite ingenuidade.|Siga a coragem; dê o primeiro passo.|Alma livre, início de jornada espiritual.|Imprudência, medo de arriscar, ingenuidade.

The Empress|A Imperatriz|👑|Terra|Vênus|S|Abundância, fertilidade, cuidado, criatividade.|Mulher em campo de trigo com coroa de 12 estrelas: natureza generosa.|Crescimento, prosperidade e conforto.|Amor nutridor, sensualidade, maternidade.|Escolha o que cultiva e nutre.|Deusa mãe, conexão com a natureza.|Dependência, bloqueio criativo, excesso de mimo.
The Emperor|O Imperador|🏛️|Fogo|Áries|S|Autoridade, estrutura, estabilidade, liderança.|Trono de pedra com cabeças de carneiro: poder e disciplina.|Organização, patrimônio sólido, chefia.|Relação estável; cuidado com controle.|Escolha com lógica e regras claras.|Ordem, pai arquetípico, soberania interior.|Rigidez, tirania, falta de disciplina.
The Hierophant|O Hierofante|📿|Terra|Touro|S|Tradição, ensino, instituições, valores.|Mestre entre dois discípulos, chaves cruzadas: saber transmitido.|Caminho convencional, estudo, contratos formais.|Compromisso, casamento, valores em comum.|Siga o que é testado e aconselhado.|Rituais, linhagens, mentores espirituais.|Dogmas, rebeldia, quebrar regras.
The Lovers|Os Enamorados|💞|Ar|Gêmeos|S|Amor, união, alinhamento de valores, escolha.|Casal sob um anjo, árvore da vida e do conhecimento: escolha consciente.|Parcerias e sociedades; alinhe valores.|União profunda, escolha do coração.|Decisão importante guiada pelo que é verdadeiro.|Alma gêmea, dualidade integrada.|Desarmonia, indecisão, escolhas por impulso.
The Chariot|O Carro|🏇|Água|Câncer|S|Vitória, determinação, controle, avanço.|Esfinges preta e branca guiadas pela vontade: domar forças opostas.|Avanço na carreira por esforço firme.|Conquista; cuidado para não competir demais.|Vá em frente com foco total.|Domínio de si, proteção.|Descontrole, agressividade, falta de rumo.

The Moon|A Lua|🌕|Água|Peixes|M|Ilusão, medo, subconsciente, incerteza.|Cão e lobo uivam para a lua; caranguejo sai da água: o caminho nebuloso.|Informação incompleta; cuidado com enganos.|Insegurança, segredos, o que não é dito.|Não decida ainda; falta clareza.|Sonhos, psiquismo, ciclos lunares.|Confusão se dissipa, verdade vem à tona.

}
function open_(id){
  cur=ALL[id];rev=false;
  $("md").innerHTML=`<div><div class="fw" id="fw">${face(cur)}</div><p style="text-align:center"><button id="fl">🔄 Virar carta</button></p></div><div><button class="x" id="cl">✕</button><h2>${cur.en}<small>${cur.pt}</small></h2><div id="info" class="info">${info(cur)}</div></div>`;
  $("fl").onclick=turn;$("cl").onclick=()=>$("ov").classList.remove("on");
  $("ov").classList.add("on");
}
function turn(){
  const fw=$("fw");if(fw.classList.contains("spin"))return;
  fw.classList.add("spin");
  setTimeout(()=>{rev=!rev;fw.firstChild.classList.toggle("rev",rev);const i=$("info");i.innerHTML=info(cur);i.classList.remove("fade");void i.offsetWidth;i.classList.add("fade")},370);
  setTimeout(()=>fw.classList.remove("spin"),760);
}
$("g").onclick=e=>{const t=e.target.closest(".tile");if(t)open_(+t.dataset.i)};
$("ov").onclick=e=>{if(e.target.id=="ov")$("ov").classList.remove("on")};
document.onkeydown=e=>{if(e.key=="Escape")$("ov").classList.remove("on")};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;$("q").value="";render()}};
$("q").oninput=render;
let dark=matchMedia("(prefers-color-scheme: dark)").matches;
const setT=()=>{document.documentElement.dataset.theme=dark?"dark":"light";$("th").textContent=dark?"☀️ Modo claro":"🌙 Modo escuro"};
$("th").onclick=()=>{dark=!dark;setT()};setT();
render();
</script>
</body>
</html>
